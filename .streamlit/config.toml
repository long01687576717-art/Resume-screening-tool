[theme]
# 克制的企业级配色：近黑色主色 + 中性灰；彩色只用于有固定含义的地方（阅读队列、提示）
base = "light"
primaryColor = "#111827"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#111827"
font = "sans serif"
headingFontWeights = [650, 650, 600, 600, 600, 600]
baseRadius = "medium"
borderColor = "#E6E8EC"
dataframeBorderColor = "#EEF0F3"
dataframeHeaderBackgroundColor = "#F7F8FA"
showWidgetBorder = true
linkColor = "#111827"
linkUnderline = false
metricValueFontSize = "1.6rem"

[client]
# 访客看到的右上角菜单只保留查看相关的选项，不显示开发者选项
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
